<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>我的技術靈感庫</title>
<style>
:root{
  --bg:#f7f8fb; --card:#fff; --text:#1b2030; --muted:#687087; --line:#e2e6ef;
  --accent:#4a5ddb; --accent-soft:#eaedfd; --hit:#1f8a6d; --hit-soft:#e3f5ef;
  --shadow:0 1px 2px rgba(27,32,48,.06),0 4px 14px rgba(27,32,48,.06);
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#11141c; --card:#1b1f2a; --text:#e9ecf5; --muted:#949db5; --line:#2e3545;
    --accent:#8a9bff; --accent-soft:#232a44; --hit:#58c9a5; --hit-soft:#17302a;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 14px rgba(0,0,0,.25);
  }
}
*{box-sizing:border-box}
/* rem 的基準在 html，整體字級靠這一行放大（改 body 對 rem 無效） */
html{font-size:17px}
body{margin:0;background:var(--bg);color:var(--text);
  font:1rem/1.7 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang TC","Noto Sans TC",sans-serif;
  -webkit-text-size-adjust:100%}
.wrap{max-width:1080px;margin:0 auto;padding:20px 16px 64px}
header h1{font-size:1.6rem;margin:0 0 2px;letter-spacing:.02em}
header p{margin:0 0 18px;color:var(--muted);font-size:.92rem}

.panel{background:var(--card);border:1px solid var(--line);border-radius:14px;
  padding:14px;margin-bottom:14px;box-shadow:var(--shadow)}
label{display:block;font-size:.85rem;font-weight:600;margin-bottom:6px}
.hint{font-size:.8rem;color:var(--muted);font-weight:400;margin-left:4px}
input[type=search]{width:100%;padding:11px 13px;font:inherit;color:var(--text);
  background:var(--bg);border:1px solid var(--line);border-radius:10px}
input:focus-visible{outline:2px solid var(--accent);outline-offset:1px}

/* 篩選與排序：單列橫向捲動，不換行（手機上向右滑） */
.row{display:flex;flex-wrap:nowrap;gap:7px;overflow-x:auto;overscroll-behavior-x:contain;
  -webkit-overflow-scrolling:touch;scrollbar-width:none;padding-bottom:2px}
.row::-webkit-scrollbar{display:none}
.sort{margin-top:12px}
.filters{margin-bottom:16px}
.chip{flex:0 0 auto;white-space:nowrap;font:inherit;font-size:.92rem;padding:7px 15px;
  border-radius:999px;cursor:pointer;background:var(--card);color:var(--muted);
  border:1px solid var(--line)}
.sort .chip{font-size:.88rem;padding:6px 14px;background:var(--bg)}
.chip[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent);
  border-color:var(--accent);font-weight:600}
.chip.code[aria-pressed="true"]{background:var(--hit-soft);color:var(--hit);border-color:var(--hit)}
.chip:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.count{font-size:.92rem;color:var(--muted);margin:0 0 12px}
.count b{color:var(--text)}

.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(300px,1fr))}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;
  box-shadow:var(--shadow);display:flex;flex-direction:column;gap:9px}
.card h2{font-size:1.18rem;margin:0;line-height:1.4}
.summary{margin:0;font-size:.98rem}
.meta{display:flex;flex-wrap:wrap;gap:5px;font-size:.85rem;color:var(--muted)}
.meta span{background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:3px 9px}
.use{margin:0;font-size:.92rem;color:var(--muted);background:var(--bg);
  border-left:3px solid var(--accent);border-radius:0 8px 8px 0;padding:7px 11px}
.new-badge{background:var(--accent);color:#fff;border-radius:6px;padding:2px 7px;
  font-size:.72rem;font-weight:700;margin-left:6px;vertical-align:middle}
.links{margin-top:auto;padding-top:6px;display:flex;flex-wrap:wrap;gap:8px}
.links a{font-size:.9rem;font-weight:600;text-decoration:none;padding:6px 12px;border-radius:9px;
  border:1px solid var(--line);color:var(--muted);background:var(--bg)}
.links a.gh{color:var(--hit);border-color:var(--hit);background:var(--hit-soft)}
.links a.demo{color:var(--accent);border-color:var(--accent);background:var(--accent-soft)}
.links a:hover{text-decoration:underline}

.msg{text-align:center;padding:48px 20px;color:var(--muted)}
.msg button{font:inherit;margin-top:12px;padding:9px 20px;border-radius:10px;cursor:pointer;
  background:var(--accent);color:#fff;border:0}
</style>
</head>
<body>
<div class="wrap">
<header>
  <h1>🧪 我的技術靈感庫</h1>
  <p>從 Threads／X／Medium／GitHub 收藏的專案與文章，可搜尋、可只看有原始碼的</p>
</header>

<div class="panel">
  <label for="q">關鍵字搜尋<span class="hint">標題、摘要、技術標籤、用途都會找</span></label>
  <input type="search" id="q" placeholder="例：three.js、粒子、地圖、Phaser" autocomplete="off">
  <div class="row sort" id="sort" role="group" aria-label="排序方式">
    <button class="chip" data-sort="new" aria-pressed="true">🕐 最近收藏</button>
    <button class="chip" data-sort="stars" aria-pressed="false">⭐ 最多星</button>
    <button class="chip" data-sort="cat" aria-pressed="false">依分類</button>
    <button class="chip" data-sort="title" aria-pressed="false">依標題</button>
  </div>
</div>

<div class="row filters" id="filters"></div>
<p class="count" id="count"></p>
<div class="grid" id="grid"></div>
<div class="msg" id="msg">載入中…</div>
</div>

<script>
// 資料來源：Google 試算表「靈感」分頁發布為 CSV 的網址。
// 本機測試可用 ?csv=<網址或相對路徑> 覆蓋，不必改這行。
const CSV_URL = '請貼上發布後的 CSV 網址';

const CAT_EMOJI = {旅遊:'✈️', 前端視覺:'✨', 遊戲開發:'🎮', 'AI 應用':'🤖', AI應用:'🤖',
  資料視覺化:'📊', 開發工具:'🛠'};

let ALL = [], SORT = 'new', ACTIVE = new Set(), CODE_ONLY = false;

/* ---------- CSV 解析（RFC4180：處理引號內的逗號與換行） ---------- */
function parseCSV(text){
  const rows=[]; let row=[], cell='', q=false;
  text = text.replace(/\r\n/g,'\n').replace(/\r/g,'\n');
  for(let i=0;i<text.length;i++){
    const c=text[i];
    if(q){
      if(c==='"'){ if(text[i+1]==='"'){cell+='"';i++;} else q=false; }
      else cell+=c;
    } else if(c==='"'){ q=true; }
    else if(c===','){ row.push(cell); cell=''; }
    else if(c==='\n'){ row.push(cell); rows.push(row); row=[]; cell=''; }
    else cell+=c;
  }
  if(cell!==''||row.length){ row.push(cell); rows.push(row); }
  return rows.filter(r=>r.some(v=>v.trim()!==''));
}

const splitTags = s => (s||'').split(/[、,，;；/\s]+/).map(v=>v.trim()).filter(Boolean);
const esc = s => String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* 收錄日期字串（yyyy/MM/dd HH:mm:ss）→ 可比較的時間；空值排最後 */
const ts = s => { const t=Date.parse(String(s).replace(/-/g,'/')); return isNaN(t)?0:t; };
const isNew = s => { const t=ts(s); return t && (Date.now()-t) < 7*864e5; };
const starNum = s => parseInt(String(s).replace(/[^\d]/g,''),10) || 0;
const starText = n => n>=1000 ? (n/1000).toFixed(n>=10000?0:1).replace(/\.0$/,'')+'k' : String(n);

/* ---------- 載入 ---------- */
const csvSrc = new URLSearchParams(location.search).get('csv') || CSV_URL;

fetch(csvSrc)
  .then(r=>{ if(!r.ok) throw new Error('HTTP '+r.status); return r.text(); })
  .then(t=>{
    const rows=parseCSV(t);
    ALL = rows.slice(1).map(r=>({
      title:(r[0]||'').trim(), summary:(r[1]||'').trim(), category:(r[2]||'').trim(),
      tags:(r[3]||'').trim(), repo:(r[4]||'').trim(), stars:(r[5]||'').trim(),
      lang:(r[6]||'').trim(), demo:(r[7]||'').trim(), url:(r[8]||'').trim(),
      source:(r[9]||'').trim(), use:(r[10]||'').trim(), added:(r[11]||'').trim()
    })).filter(x=>x.title);
    // 空資料庫是正常狀態（還沒收藏），不是錯誤——不要顯示成讀取失敗
    if(!ALL.length){
      document.getElementById('msg').innerHTML=
        '<p style="font-size:2.4rem;margin:0 0 8px">📭</p>'+
        '<p><b>還沒有收藏任何靈感</b></p>'+
        '<p style="font-size:.88rem">用手機捷徑分享一篇技術文章，<br>整理好之後就會出現在這裡。</p>';
      return;
    }
    document.getElementById('msg').hidden=true;
    buildFilters(); render();
  })
  .catch(err=>{
    document.getElementById('msg').innerHTML =
      '<p>讀不到靈感資料<br><small>'+esc(err.message)+'</small></p>'+
      '<button onclick="location.reload()">重新整理</button>';
  });

/* ---------- 篩選按鈕（依實際資料生成；分類在前，技術標籤在後） ---------- */
function buildFilters(){
  const cats=new Map(), tags=new Map();
  ALL.forEach(r=>{
    if(r.category) cats.set(r.category,(CAT_EMOJI[r.category]||'')+' '+r.category);
    splitTags(r.tags).forEach(t=>tags.set(t,'#'+t));
  });
  const box=document.getElementById('filters');
  const mk=(v,label,cls)=>'<button class="chip'+(cls?' '+cls:'')+'" data-v="'+esc(v)+'" aria-pressed="false">'+esc(label)+'</button>';
  box.innerHTML = mk('__code__','⭐ 只看有原始碼','code')
    + [...cats].map(([v,l])=>mk(v,l)).join('')
    + [...tags].map(([v,l])=>mk(v,l)).join('');

  box.querySelectorAll('.chip').forEach(b=>b.addEventListener('click',()=>{
    const v=b.dataset.v, on=b.getAttribute('aria-pressed')==='true';
    b.setAttribute('aria-pressed', on?'false':'true');
    if(v==='__code__') CODE_ONLY=!on;
    else if(on) ACTIVE.delete(v); else ACTIVE.add(v);
    render();
  }));
}

document.getElementById('q').addEventListener('input', render);
document.getElementById('sort').querySelectorAll('.chip').forEach(b=>{
  b.addEventListener('click',()=>{
    SORT=b.dataset.sort;
    document.getElementById('sort').querySelectorAll('.chip')
      .forEach(x=>x.setAttribute('aria-pressed', String(x===b)));
    render();
  });
});

function sortList(list){
  const arr=list.slice();
  if(SORT==='new') arr.sort((a,b)=>ts(b.added)-ts(a.added));
  else if(SORT==='stars') arr.sort((a,b)=>starNum(b.stars)-starNum(a.stars)||ts(b.added)-ts(a.added));
  else if(SORT==='cat') arr.sort((a,b)=>a.category.localeCompare(b.category,'zh-Hant')||ts(b.added)-ts(a.added));
  else if(SORT==='title') arr.sort((a,b)=>a.title.localeCompare(b.title,'zh-Hant'));
  return arr;
}

/* ---------- 渲染 ---------- */
function render(){
  const grid=document.getElementById('grid');
  const countEl=document.getElementById('count');
  let list=ALL.slice();

  if(CODE_ONLY) list=list.filter(r=>r.repo);
  // 多個標籤＝且（都要符合），跟食譜庫一致
  if(ACTIVE.size) list=list.filter(r=>[...ACTIVE].every(v=>(r.category+' '+r.tags).includes(v)));

  const q=document.getElementById('q').value.trim().toLowerCase();
  if(q){
    const terms=q.split(/\s+/);
    list=list.filter(r=>{
      const hay=[r.title,r.summary,r.category,r.tags,r.lang,r.use,r.source,r.repo]
        .join(' ').toLowerCase();
      return terms.every(t=>hay.includes(t));
    });
  }

  list=sortList(list);
  const withCode=list.filter(r=>r.repo).length;
  countEl.innerHTML='共 <b>'+list.length+'</b> 筆靈感'+
    (withCode?'，<b>'+withCode+'</b> 筆有 GitHub 原始碼':'');
  grid.innerHTML=list.map(card).join('') ||
    '<p class="msg">找不到符合的靈感，換個關鍵字或取消幾個篩選</p>';
}

function card(r){
  const meta=[];
  if(r.category) meta.push((CAT_EMOJI[r.category]||'')+' '+r.category);
  if(r.lang) meta.push('💻 '+r.lang);
  if(r.source) meta.push('📱 '+r.source);
  if(ts(r.added)) meta.push('📌 '+new Date(ts(r.added))
    .toLocaleDateString('zh-TW',{year:'numeric',month:'2-digit',day:'2-digit'})+' 收藏');
  splitTags(r.tags).forEach(t=>meta.push('#'+t));

  const links=[];
  if(r.repo) links.push('<a class="gh" href="'+esc(r.repo)+'" target="_blank" rel="noopener noreferrer">⌨ 原始碼'+
    (starNum(r.stars)?' ★'+starText(starNum(r.stars)):'')+'</a>');
  if(r.demo) links.push('<a class="demo" href="'+esc(r.demo)+'" target="_blank" rel="noopener noreferrer">▶ 線上 Demo</a>');
  if(r.url) links.push('<a href="'+esc(r.url)+'" target="_blank" rel="noopener noreferrer">📄 原文</a>');

  return '<article class="card">'+
    '<h2>'+esc(r.title)+(isNew(r.added)?'<span class="new-badge">新收藏</span>':'')+'</h2>'+
    (r.summary?'<p class="summary">'+esc(r.summary)+'</p>':'')+
    (meta.length?'<div class="meta">'+meta.map(m=>'<span>'+esc(m)+'</span>').join('')+'</div>':'')+
    (r.use?'<p class="use">💡 '+esc(r.use)+'</p>':'')+
    (links.length?'<div class="links">'+links.join('')+'</div>':'')+
  '</article>';
}
</script>
</body>
</html>
